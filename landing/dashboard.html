<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dasbor — Tokora</title>
  <meta name="theme-color" content="#0B1B3F">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script>try{var t=localStorage.getItem('tokora-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <!-- Belum login → ke halaman Masuk (sesi demo, lihat js/session.js) -->
  <script>try{if(!localStorage.getItem('tokora-session'))location.replace('login.html');}catch(e){}</script>
</head>
<body class="dash-body">
  <a class="skip-link" href="#view">Langsung ke konten</a>

  <div class="dash">
    <!-- ============ SIDEBAR ============ -->
    <aside class="side" data-side aria-label="Navigasi dasbor">
      <a href="dashboard.html#ringkasan" class="brand">
        <svg class="brand__mark" viewBox="0 0 40 40" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="20" cy="20" r="18"/><path d="M13 16h14l-1.6 12.5a1.5 1.5 0 0 1-1.5 1.3h-7.8a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M16.5 16v-1.5a3.5 3.5 0 0 1 7 0V16"/></svg>
        <span>TOKORA</span>
      </a>
      <div class="side__store">
        <span class="ava" data-store-initial>TK</span>
        <div><b data-store-name>Toko</b><small data-store-host>—</small></div>
      </div>
      <div class="mode-switch" role="group" aria-label="Mode dasbor">
        <button type="button" data-mode="seller">Seller</button>
        <button type="button" data-mode="mitra">Mitra</button>
      </div>
      <nav class="side__nav" data-nav-list aria-label="Menu"></nav>
      <div class="side__foot">
        <div class="side__plan" data-plan></div>
        <a class="side__link" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>Ke situs Tokora</a>
        <button class="side__link" type="button" data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Keluar</button>
      </div>
    </aside>
    <div class="side-backdrop" data-side-backdrop></div>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" type="button" data-menu aria-label="Buka menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="topbar__title" data-title>Ringkasan</span>
        <div class="topbar__actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Ganti tema terang / gelap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button>
          <div class="user">
            <button class="user__btn" type="button" data-user-btn aria-expanded="false" aria-haspopup="true"><span class="ava" data-user-initial>S</span><span data-user-name>Seller</span></button>
            <div class="user__menu" data-user-menu>
              <small data-user-email></small>
              <a href="#pengaturan">Pengaturan toko</a>
              <a href="index.html">Ke situs Tokora</a>
              <button type="button" data-logout>Keluar</button>
            </div>
          </div>
        </div>
      </header>

      <main class="view" id="view" data-view tabindex="-1"></main>
    </div>
  </div>

  <!-- modal umum (isi diisi JS) -->
  <div class="dlg" data-dlg aria-hidden="true">
    <div class="dlg__backdrop" data-dlg-close></div>
    <div class="dlg__box" role="dialog" aria-modal="true" data-dlg-box></div>
  </div>
  <div class="toasts" data-toasts aria-live="polite"></div>

  <script src="js/session.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
